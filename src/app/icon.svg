<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The design language at 16px: ink ground, hairline-thin bars, and the one
       red mark that everywhere else means "this is happening right now". -->
  <rect width="32" height="32" fill="#000000"/>
  <rect x="6"  y="14" width="4" height="4"  fill="#ffffff"/>
  <rect x="12" y="8"  width="4" height="16" fill="#ffffff"/>
  <rect x="18" y="11" width="4" height="10" fill="#e30613"/>
  <rect x="24" y="6"  width="2" height="20" fill="#ffffff"/>
</svg>
